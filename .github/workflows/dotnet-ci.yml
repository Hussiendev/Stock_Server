name: .NET CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Stock_Server/Stock_Server.csproj

    - name: Build
      run: dotnet build Stock_Server/Stock_Server.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Stock_Server.Tests/Stock_Server.Tests.csproj --no-build --configuration Release